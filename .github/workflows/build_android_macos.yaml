name: Build Android and macOS

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build Android artifacts
        required: true
        type: boolean
        default: true
      build_macos:
        description: Build macOS artifact
        required: true
        type: boolean
        default: true

concurrency:
  group: build_android_macos_${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free_up_space
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: moonrepo/setup-rust@v1
        with:
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm,android-arm64
      - name: Build Android App Bundle
        run: flutter build appbundle --release --target-platform android-arm,android-arm64
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fluffychat-android-release
          path: |
            build/app/outputs/apk/release/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release/mapping.txt

  build_macos:
    if: ${{ inputs.build_macos }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - name: Use Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - run: brew install sqlcipher
      - uses: moonrepo/setup-rust@v1
        with:
          cache: true
      - name: Build macOS app with Xcode
        run: bash ./scripts/build-macos-ci.sh
      - name: Package macOS app
        run: bash ./scripts/package-macos-app.sh
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: fluffychat-macos-release
          path: build/macos/FluffyChat-macos.zip
