name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      upload_to_release:
        description: Upload artifacts to GitHub Release
        required: true
        default: false
        type: boolean
      sign_release:
        description: Sign release build (requires signing secrets or manual signing inputs)
        required: true
        default: false
        type: boolean
      build_aab:
        description: Also build release AAB (requires signed release)
        required: true
        default: false
        type: boolean
      manual_keystore_base64:
        description: Optional one-time keystore (base64). Prefer repository secrets.
        required: false
        type: string
      manual_key_alias:
        description: Optional key alias for manual keystore
        required: false
        type: string
      manual_key_password:
        description: Optional key password for manual keystore
        required: false
        type: string
      manual_store_password:
        description: Optional keystore password for manual keystore
        required: false
        type: string
  push:
    tags:
      - "v*"
      - "android-v*"

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_android:
    name: Build Android Artifacts
    # runs-on: self-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALIYUN_HTTPDNS_ACCOUNT_ID: ${{ secrets.ALIYUN_HTTPDNS_ACCOUNT_ID }}
      ALIYUN_HTTPDNS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_HTTPDNS_ACCESS_KEY_ID }}
      ALIYUN_HTTPDNS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_HTTPDNS_ACCESS_KEY_SECRET }}
    environment:
      name: android-build
      deployment: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Flutter version
        id: flutter_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^  flutter:[[:space:]]*\([^[:space:]]*\).*$/\1/p' .tool_versions.yaml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Unable to read flutter version from .tool_versions.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve build parameters
        id: params
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_BUILD_MODE: ${{ github.event.inputs.build_mode }}
          INPUT_UPLOAD_TO_RELEASE: ${{ github.event.inputs.upload_to_release }}
          INPUT_SIGN_RELEASE: ${{ github.event.inputs.sign_release }}
          INPUT_BUILD_AAB: ${{ github.event.inputs.build_aab }}
          SECRET_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          build_mode="debug"
          upload_to_release="false"
          sign_release="false"
          build_aab="false"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            build_mode="$INPUT_BUILD_MODE"
            upload_to_release="$INPUT_UPLOAD_TO_RELEASE"
            sign_release="$INPUT_SIGN_RELEASE"
            build_aab="$INPUT_BUILD_AAB"
          elif [[ "$EVENT_NAME" == "push" && "$REF" == refs/tags/* ]]; then
            build_mode="release"
            upload_to_release="true"
            if [[ -n "$SECRET_KEYSTORE_B64" ]]; then
              sign_release="true"
            fi
          fi

          echo "build_mode=$build_mode" >> "$GITHUB_OUTPUT"
          echo "upload_to_release=$upload_to_release" >> "$GITHUB_OUTPUT"
          echo "sign_release=$sign_release" >> "$GITHUB_OUTPUT"
          echo "build_aab=$build_aab" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # Keep writeback on main only, avoid heavy cache uploads on tags/feature branches.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Prepare Emoji Kitchen metadata
        run: dart run scripts/prepare_emoji_kitchen_metadata.dart

      - name: Prepare release signing
        id: signing
        if: steps.params.outputs.build_mode == 'release'
        shell: bash
        env:
          WANT_SIGN: ${{ steps.params.outputs.sign_release }}
          SECRET_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SECRET_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ "$WANT_SIGN" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "FLUFFYCHAT_UNSIGNED_RELEASE=true" >> "$GITHUB_ENV"
            exit 0
          fi

          keystore_b64="$SECRET_KEYSTORE_B64"
          key_alias="$SECRET_KEY_ALIAS"
          key_password="$SECRET_KEY_PASSWORD"
          store_password="$SECRET_STORE_PASSWORD"

          if [[ -z "$keystore_b64" ]]; then
            # Read manual inputs from event payload to avoid printing them in step env.
            keystore_b64="$(jq -r '.inputs.manual_keystore_base64 // ""' "$GITHUB_EVENT_PATH")"
            key_alias="$(jq -r '.inputs.manual_key_alias // ""' "$GITHUB_EVENT_PATH")"
            key_password="$(jq -r '.inputs.manual_key_password // ""' "$GITHUB_EVENT_PATH")"
            store_password="$(jq -r '.inputs.manual_store_password // ""' "$GITHUB_EVENT_PATH")"
          fi

          if [[ -z "$keystore_b64" || -z "$key_alias" || -z "$key_password" || -z "$store_password" ]]; then
            echo "Signing is enabled but signing parameters are incomplete." >&2
            echo "Provide ANDROID_* secrets or manual_* workflow inputs." >&2
            exit 1
          fi

          echo "$keystore_b64" | base64 --decode --ignore-garbage > android/key.jks
          {
            echo "storePassword=$store_password"
            echo "keyPassword=$key_password"
            echo "keyAlias=$key_alias"
            echo "storeFile=../key.jks"
          } > android/key.properties
          chmod 600 android/key.jks android/key.properties
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        if: steps.params.outputs.build_mode == 'debug'
        env:
          FLUFFYCHAT_ABI_FILTERS: arm64-v8a
        run: flutter build apk --debug --target-platform android-arm64

      - name: Build release artifacts
        if: steps.params.outputs.build_mode == 'release'
        shell: bash
        env:
          FLUFFYCHAT_ABI_FILTERS: arm64-v8a
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64
          if [[ "${{ steps.signing.outputs.enabled }}" == "true" && "${{ steps.params.outputs.build_aab }}" == "true" ]]; then
            flutter build appbundle --release --target-platform android-arm64
          fi

      - name: List output files
        shell: bash
        run: |
          set -euo pipefail
          ls -lah build/app/outputs/flutter-apk || true
          ls -lah build/app/outputs/bundle/release || true

      - name: Resolve release metadata
        id: release_meta
        if: steps.params.outputs.upload_to_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_name="$(date -u '+%Y%m%d-%H%M%S')"
          echo "tag=$release_name" >> "$GITHUB_OUTPUT"
          echo "name=$release_name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.params.outputs.build_mode }}-arm64-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

      - name: Upload artifacts to GitHub Release
        if: steps.params.outputs.upload_to_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

      - name: Cleanup signing files
        if: always()
        shell: bash
        run: rm -f android/key.jks android/key.properties
